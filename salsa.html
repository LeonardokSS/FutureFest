<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioEnergy - Produtos Rotacionando</title>
<style>
/* ======= GERAL ======= */
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #021d10 0%, #000 100%);
  font-family: "Poppins", sans-serif;
  color: #fff;
}

/* ======= CONTAINER PRINCIPAL ======= */
.wrapper {
  width: 300px;
  height: 360px;
  perspective: 1000px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ======= ANIMAÇÃO ======= */
.inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  animation: rotating 22s linear infinite;
}

@keyframes rotating {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(360deg); }
}

/* ======= CARD ======= */
article.card {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 18px;
  background: linear-gradient(180deg, #0f2e1d 0%, #013220 100%);
  border: 1px solid rgba(40, 167, 69, 0.4);
  box-shadow: 0 0 22px rgba(0, 255, 150, 0.12);
  transform: rotateY(calc(360deg / var(--quantity) * var(--index))) translateZ(280px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  overflow: hidden;
  transition: all 0.4s ease;
}

.card:hover {
  transform: scale(1.05) rotateY(calc(360deg / var(--quantity) * var(--index))) translateZ(280px);
  box-shadow: 0 0 28px rgba(0, 255, 150, 0.3);
}

/* ======= IMAGEM DO PRODUTO ======= */
figure {
  width: 100%;
  height: 70%;
  margin: 0;
  position: relative;
}

figure img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-bottom: 2px solid rgba(0, 255, 120, 0.2);
  transition: opacity 0.3s ease;
}

.card:hover img {
  opacity: 0.9;
}

/* ======= NOME DO PRODUTO ======= */
figcaption {
  text-align: center;
  font-size: 1.1rem;
  font-weight: 600;
  color: #00ff88;
  margin-top: 8px;
}

/* ======= BOTÃO (LINK) ======= */
.card footer {
  padding: 12px;
}

.card a {
  display: inline-block;
  text-decoration: none;
  background: transparent;
  border: 1.5px solid #00ff88;
  color: #00ff88;
  border-radius: 6px;
  padding: 8px 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.card a:hover {
  background-color: #00ff88;
  color: #000;
  box-shadow: 0 0 10px #00ff88;
}

/* ======= RESPONSIVO ======= */
@media (max-width: 600px) {
  .wrapper {
    width: 240px;
    height: 300px;
  }
  .card {
    transform: rotateY(calc(360deg / var(--quantity) * var(--index))) translateZ(220px);
  }
  figcaption {
    font-size: 1rem;
  }
}
</style>
</head>
<body>

<section class="wrapper" aria-label="Carrossel de produtos BioEnergy">
  <div class="inner" style="--quantity: 6;">

    <!-- CARD 1 -->
    <article class="card" style="--index: 0;">
      <figure>
        <img src="/FutureFest/public/img/produtos/BioEnergyCube.jpg" alt="BioEnergy Cube - Sistema compacto de energia por biomassa.">
        <figcaption>BioEnergy Cube</figcaption>
      </figure>
      <footer><a href="/produtos">Saiba Mais</a></footer>
    </article>

    <!-- CARD 2 -->
    <article class="card" style="--index: 1;">
      <figure>
        <img src="/FutureFest/public/img/produtos/BioEnergyEcoDrive.jpg" alt="BioEnergy EcoDrive - Tecnologia sustentável para geração de energia.">
        <figcaption>BioEnergy EcoDrive</figcaption>
      </figure>
      <footer><a href="/produtos">Saiba Mais</a></footer>
    </article>

    <!-- CARD 3 -->
    <article class="card" style="--index: 2;">
      <figure>
        <img src="/FutureFest/public/img/produtos/BioEnergyWooderPro.png" alt="BioEnergy Container - Solução modular para energia renovável.">
        <figcaption>BioEnergy Container</figcaption>
      </figure>
      <footer><a href="/produtos">Saiba Mais</a></footer>
    </article>

    <!-- CARD 4 -->
    <article class="card" style="--index: 3;">
      <figure>
        <img src="/FutureFest/public/img/produtos/BioEnergyWoodX.jpg" alt="BioEnergy WoodX - Sistema avançado de biomassa.">
        <figcaption>BioEnergy WoodX</figcaption>
      </figure>
      <footer><a href="/produtos">Saiba Mais</a></footer>
    </article>

    <!-- CARD 5 -->
    <article class="card" style="--index: 4;">
      <figure>
        <img src="/FutureFest/public/img/produtos/BioEnergyWooderPro.jpg" alt="BioEnergy Wooder Pro - Equipamento sustentável.">
        <figcaption>BioEnergy Wooder Pro</figcaption>
      </figure>
      <footer><a href="/produtos">Saiba Mais</a></footer>
    </article>

    <!-- CARD 6 -->
    <article class="card" style="--index: 5;">
      <figure>
        <img src="/FutureFest/public/img/produtos/BioEnergyWooderPro.png" alt="BioEnergy Container - Solução modular para energia renovável.">
        <figcaption>BioEnergy Container</figcaption>
      </figure>
      <footer><a href="/produtos">Saiba Mais</a></footer>
    </article>

  </div>
</section>

</body>
</html>
