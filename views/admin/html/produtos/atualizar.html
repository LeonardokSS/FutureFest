<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atualizar Produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar responsiva -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Sistema</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin">Administradores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/admin/produtos">Produtos</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="text-center mb-4">Atualizar Produto</h1>

            <!-- Botões de navegação -->
            <div class="d-flex justify-content-center gap-3 mb-4">
              <a href="/" class="btn btn-primary">Página Inicial</a>
              <a href="/admin" class="btn btn-secondary">Página dos Administradores</a>
              <a href="/admin/produtos" class="btn btn-success">Lista de Produtos</a>
            </div>

            <!-- Formulário -->
            <form action="/admin/produtos_atualizar" method="post" id="formAtualizar">
              <input type="hidden" name="id" id="id">

              <!-- Nome -->
              <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" step="0.01" name="nome" id="nome" class="form-control" required>
              </div>

              <!-- Tipo de biomassa -->
              <div class="mb-3">
                <label for="tipo" class="form-label">Tipo de Biomassa:</label>
                <select name="tipo" id="tipo" class="form-select" required>
                  <option value="grupoA">Cana de açucar, esterco e palha</option>
                  <option value="grupoB">Madeira, cavacos e aparas </option>
                </select>
              </div>

              <!-- Capacidade -->
              <div class="mb-3">
                <label for="capacidade" class="form-label">Capacidade:</label>
                <input type="number" step="0.01" name="capacidade" id="capacidade" class="form-control" required>
              </div>

              <!-- Taxa -->
              <div class="mb-3">
                <label for="taxa" class="form-label">Taxa:</label>
                <input type="text" step="0.01" name="taxa" id="taxa" class="form-control" required>
              </div>

              <!-- Tempo -->
              <div class="mb-3">
                <label for="tempo" class="form-label">Tempo de Produção:</label>
                <input type="text" name="tempo" id="tempo" class="form-control" required>
              </div>

              <!-- Energia Total -->
              <div class="mb-3">
                <label for="energiaTotal" class="form-label">Energia Total:</label>
                <input type="text" name="energiaTotal" id="energiaTotal" class="form-control" required>
              </div>

              <!-- Custo p/ciclo -->
              <div class="mb-3">
                <label for="custoCiclo" class="form-label">Custo p/ciclo:</label>
                <input type="number" name="custoCiclo" id="custoCiclo" class="form-control" required>
              </div>

            <!-- Eficiência -->
              <div class="mb-3">
                <label for="eficiencia" class="form-label">Eficiência:</label>
                <input type="text" name="eficiencia" id="eficiencia" class="form-control" required>
              </div>

              <!-- Preço -->
              <div class="mb-3">
                <label for="preco" class="form-label">Preço (Em R$):</label>
                <input type="number" name="preco" id="preco" class="form-control" required>
              </div>

              <!--Estoque-->
              <div class="mb-3">
                <label for="estoque" class="form-label">Quantidade:</label>
                <input type="number" name="estoque" id="estoque" class="form-control" required>
              </div>

              <!-- Disponível -->
              <div class="mb-3">
                <label for="disponivel" class="form-label">Disponível:</label>
                <select name="disponivel" id="disponivel" class="form-select" required>
                  <option value="Sim">Sim</option>
                  <option value="Não">Não</option>
                </select>
              </div>

              <button type="submit" class="btn btn-primary w-100">Salvar Alterações</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script para preencher os dados -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

    // Preencher dados do produto
      if (id) {
        fetch(`/admin/produto/${id}`)
          .then(response => response.json())
          .then(produto => {
            document.getElementById("id").value = produto._id;
            document.getElementById("nome").value = produto.nome;
            document.getElementById("tipo").value = produto.tipo;
            document.getElementById("capacidade").value = produto.capacidade;
            document.getElementById("taxa").value = produto.taxa;
            document.getElementById("tempo").value = produto.tempo
            document.getElementById("energiaTotal").value = produto.energiaTotal;
            document.getElementById("custoCiclo").value = produto.custoCiclo;
            document.getElementById("eficiencia").value = produto.eficiencia;
            document.getElementById("preco").value = produto.preco;
            document.getElementById("estoque").value = produto.estoque;
            document.getElementById("disponivel").value = manutencao.disponivel;
          })
          .catch(error => console.error('Erro ao carregar dados do produto: ', error));
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
