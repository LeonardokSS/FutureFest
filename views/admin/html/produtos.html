<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página dos Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <style>
  table {
    font-size: 1rem; /* aumenta fonte das células */
  }

  thead th {
    font-size: 1.1rem; /* aumenta fonte do cabeçalho */
  }

  .btn-group .btn {
    font-size: 0.95rem; /* aumenta tamanho dos botões */
    padding: 0.45rem 0.9rem;
  }

  .card-body h1 {
    font-size: 2.2rem;
  }

  .card-body h2 {
    font-size: 1.8rem;
  }

  .table-responsive {
    overflow-x: auto;
  }
  </style>
  <!-- Navbar responsiva -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Sistema</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin">Administradores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/admin/produtos">Produtos</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-12">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="text-center mb-4">Bem-vindo ao sistema de Produtos</h1>

            <!-- Botões de navegação -->
            <div class="d-flex justify-content-center gap-3 mb-4">
              <a href="/" class="btn btn-primary">Página Inicial</a>
              <a href="/admin" class="btn btn-secondary">Página dos Administradores</a>
              <a href="/admin/produtos_cadastro" class="btn btn-success">Cadastrar Novo Produto</a>
            </div>

            <h2 class="text-center">Lista de Produtos</h2>
            <div class="table-responsive">
              <table class="table table-bordered text-center">
              <thead class="table-light">
                <tr>
                  <th>ID Produto</th>
                  <th>Nome</th>
                  <th>Tipo</th>
                  <th>Capacidade</th>
                  <th>Taxa</th>
                  <th>Tempo</th>
                  <th>Energia Total</th>
                  <th>Custo p/ciclo</th>
                  <th>Eficiência</th>
                  <th>Preço</th>
                  <th>Estoque</th>
                  <th>Disponível</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="produtos-tabela">
                <!-- Conteúdo preenchido via JS -->
              </tbody>
            </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script para carregar usuários -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('/admin/listar_produtos')
        .then(response => response.json())
        .then(produtos => {
          const tabela = document.getElementById('produtos-tabela')
          tabela.innerHTML = produtos.map(produto => `
            <tr>
              <td>${produto._id}</td>
              <td>${produto.nome}</td>
              <td>${produto.tipo}</td>
              <td>${produto.capacidade}</td>
              <td>${produto.taxa}</td>
              <td>${produto.tempo}</td>
              <td>${produto.energiaTotal}</td>
              <td>${produto.custoCiclo}</td>
              <td>${produto.eficiencia}</td>
              <td>${produto.preco}</td>
              <td>${produto.estoque}</td>
              <td>${produto.disponivel}</td>
              <td>
                <div class="btn-group btn-group-sm" role="group">
                  <a href="/admin/produtos_atualizar?id=${produto._id}" class="btn btn-warning">Atualizar</a>
                  <form action="/admin/produtos_deletar" method="post" onsubmit="return confirm('Tem certeza que deseja excluir o produto?')">
                    <input type="hidden" name="id" value="${produto._id}">
                    <button type="submit" class="btn btn-danger">Deletar</button>
                  </form>
                </div>
              </td>
            </tr>
          `).join("")
        })
        .catch(error => console.error('Erro ao carregar produtos: ', error))
    })
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
